[project]
name = "newssummarizer"
version = "0.1.0"
description = "Cache Reuters stories, compare independent coverage, and write one-minute scripts."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "trafilatura>=1.9",
]

[project.scripts]
newssummarizer = "newssummarizer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
